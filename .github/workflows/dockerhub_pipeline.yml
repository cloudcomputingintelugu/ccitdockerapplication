name: Docker CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  docker:
    name: Build Scan and Push Docker Image to Docker Hub
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Define Docker image name and tag
      - name: Set Docker Image
        run: |
          echo "IMAGE_NAME=cloudintelugu/githubrepos" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # 5. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      # 6. Display image
      - name: Display Docker Image
        run: |
          echo "Docker Image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"

      # 7. Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

          trivy --version

      # 8. Trivy vulnerability scan
      - name: Trivy Image Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      # 9. Push Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"

      # 10. Save exact image information
      - name: Save Image Information
        run: |
          echo "${IMAGE_NAME}:${IMAGE_TAG}" > image-tag.txt

          echo "Image information:"
          cat image-tag.txt

      # 11. Upload image tag artifact
      - name: Upload Image Tag
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tag
          path: image-tag.txt

      # 12. GitHub Actions summary
      - name: Docker CI Summary
        run: |
          echo "## 🐳 Docker CI Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Item | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | master |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Image | \`${IMAGE_NAME}:${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Build | ✅ PASSED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy Scan | ✅ PASSED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Push | ✅ PASSED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Artifact | ✅ UPLOADED |" >> "$GITHUB_STEP_SUMMARY"