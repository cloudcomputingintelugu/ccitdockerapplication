name: GitOps ArgoCD Update

on:
  workflow_run:
    workflows:
      - Docker CI Pipeline
    types:
      - completed

jobs:
  update-argocd:
    name: Update ArgoCD Repository
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:

      # 1. Download the exact image tag generated by Pipeline 2
      - name: Download Image Tag
        uses: actions/download-artifact@v5
        with:
          name: docker-image-tag
          path: image-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Read image information
      - name: Read Image Tag
        run: |
          IMAGE=$(cat image-info/image-tag.txt)

          echo "IMAGE=$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # 3. Checkout ArgoCD repository
      - name: Checkout ArgoCD Repository
        uses: actions/checkout@v4
        with:
          repository: cloudcomputingintelugu/ArgoCD
          token: ${{ secrets.ARGOCD_REPO_TOKEN }}
          path: argocd

      # 4. Update Kubernetes deployment
      - name: Update Kubernetes Image
        run: |
          cd argocd

          echo "Updating Kubernetes manifest..."

          sed -i \
            "s|image: .*|image: ${IMAGE}|" \
            deployment.yaml

          echo "Updated image:"
          grep "image:" deployment.yaml

      # 5. Commit changes
      - name: Commit ArgoCD Changes
        run: |
          cd argocd

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployment.yaml

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update image to ${IMAGE}"

      # 6. Push changes
      - name: Push ArgoCD Changes
        run: |
          cd argocd
          git push origin HEAD:master

      # 7. GitHub summary
      - name: GitOps Summary
        run: |
          echo "## 🚀 ArgoCD GitOps Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Item | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source Image | \`${IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ArgoCD Repository | \`cloudcomputingintelugu/ArgoCD\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Manifest | \`deployment.yaml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitOps Update | ✅ PASSED |" >> "$GITHUB_STEP_SUMMARY"